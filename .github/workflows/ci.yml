name: API CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Lint and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.txt

      - name: Install application and test dependencies
        run: python -m pip install -r requirements-dev.txt -c requirements.lock

      - name: Lint
        run: python -m ruff check main.py tests

      - name: Test
        run: python -m pytest -v --junitxml=test-results.xml

      - name: Preserve test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results
          path: test-results.xml
          if-no-files-found: ignore
          retention-days: 7

  build:
    name: Build image after checks pass
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build versioned image
        run: docker build -t "apex-operations-api:${GITHUB_SHA}" .

      - name: Verify image runs as non-root and imports the API
        run: |
          docker run --rm --entrypoint python "apex-operations-api:${GITHUB_SHA}" \
            -c "import os; import main; assert os.getuid() != 0; print('Non-root UID:', os.getuid()); print('API version:', main.app.version)"
