name: CI

on:
  push:
    branches: [final-deliverable]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

# Least privilege by default; only the jobs that publish get packages: write.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: task-api

jobs:
  test:
    name: Lint and test
    if: github.ref_type != 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
        env:
          POSTGRES_DB: apex_test
          POSTGRES_USER: apex
          POSTGRES_PASSWORD: apex   # throwaway CI-only database
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U apex" --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://apex:apex@localhost:5432/apex_test
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint (ruff, incl. bandit security rules)
        run: ruff check .
      - name: Test against PostgreSQL
        run: pytest -v --junitxml=test-results.xml
      - name: Audit locked dependencies for known vulnerabilities (pip-audit)
        run: pip-audit -r requirements.lock --strict
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: test-results
          path: test-results.xml
          retention-days: 14

  image:
    name: Build, scan and publish image
    needs: test   # a failed lint/test means no image is ever built or published
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Resolve image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/${IMAGE_NAME}" >> "$GITHUB_ENV"
      - name: Build
        run: |
          docker build \
            --build-arg APP_VERSION="${GITHUB_SHA::7}" \
            --label org.opencontainers.image.source="https://github.com/${GITHUB_REPOSITORY}" \
            --label org.opencontainers.image.revision="${GITHUB_SHA}" \
            -t "$IMAGE:$GITHUB_SHA" .
      - name: Verify container runs as non-root
        run: |
          uid=$(docker run --rm --entrypoint id "$IMAGE:$GITHUB_SHA" -u)
          echo "container uid: $uid"
          test "$uid" != "0"
      - name: Full-stack smoke test (Compose, restricted DB role)
        # Runs the built image the way it is deployed. Added after the v1.0.1 incident, where a
        # bad runtime setting baked into the image passed the unit tests.
        run: |
          cp .env.example .env
          sed -i "s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=$(openssl rand -hex 16)/" .env
          sed -i "s/^APP_DB_PASSWORD=.*/APP_DB_PASSWORD=$(openssl rand -hex 16)/" .env
          API_IMAGE="$IMAGE:$GITHUB_SHA" docker compose up -d --no-build --wait --wait-timeout 90
          curl -fsS -X POST localhost:8088/tasks -H 'content-type: application/json' -d '{"title":"ci smoke"}'
          curl -fsS localhost:8088/tasks -o tasks.json && grep -q 'ci smoke' tasks.json
          psql_app() { docker compose exec -T db sh -c "psql -U \"\$APP_DB_USER\" -d \"\$POSTGRES_DB\" -tAc '$1'"; }
          test "$(psql_app 'SELECT rolsuper FROM pg_roles WHERE rolname = current_user')" = f
          if psql_app 'DELETE FROM tasks'; then echo "API role must not be able to DELETE"; exit 1; fi
          echo "PASS: image serves reads/writes; API role is not superuser and cannot DELETE"
      - name: Smoke stack logs (on failure)
        if: failure()
        run: docker compose logs
      - name: Stop smoke stack
        if: always()
        run: docker compose down -v || true
      - name: Trivy vulnerability scan (fail on fixable HIGH/CRITICAL)
        # Pinned by digest: trivy-action and trivy 0.69.4-0.69.6 were compromised in March 2026.
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy@sha256:bcc376de8d77cfe086a917230e818dc9f8528e3c852f7b1aff648949b6258d1c \
            image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --no-progress \
            "$IMAGE:$GITHUB_SHA"
      - name: Publish to GHCR (immutable commit-SHA tag)
        if: github.event_name == 'push'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$IMAGE:$GITHUB_SHA"
          echo "Published \`$IMAGE:$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Promote tested image to release tag
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      packages: write
    steps:
      - name: Retag the commit's already-tested image (no rebuild)
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}/${IMAGE_NAME}"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          # Fails if this commit never passed CI, because its SHA image was never published.
          docker buildx imagetools create --tag "$image:$GITHUB_REF_NAME" "$image:$GITHUB_SHA"
          docker buildx imagetools inspect "$image:$GITHUB_REF_NAME"
          echo "Released \`$image:$GITHUB_REF_NAME\` -> \`$image:$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"
