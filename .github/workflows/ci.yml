name: API CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Lint and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.txt

      - name: Install application and test dependencies
        run: python -m pip install -r requirements-dev.txt -c requirements.lock

      - name: Lint
        run: python -m ruff check main.py tests

      - name: Test
        run: python -m pytest -v --junitxml=test-results.xml

      - name: Preserve test report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: test-results
          path: test-results.xml
          if-no-files-found: ignore
          retention-days: 7

  build:
    name: Build image after checks pass
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Build versioned image
        run: |
          docker build \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            -t "apex-operations-api:${GITHUB_SHA}" .

      - name: Verify image runs as non-root and imports the API
        run: |
          docker run --rm --entrypoint python "apex-operations-api:${GITHUB_SHA}" \
            -c "import os; import main; assert os.getuid() != 0; print('Non-root UID:', os.getuid()); print('API version:', main.app.version)"

      - name: Publish checked image to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker tag "apex-operations-api:${GITHUB_SHA}" "$image"
          docker push "$image"
          digest_ref=$(docker image inspect "$image" --format '{{index .RepoDigests 0}}')
          {
            echo '### Published image'
            echo "Commit tag: \`$image\`"
            echo "Deploy by digest: \`$digest_ref\`"
          } >> "$GITHUB_STEP_SUMMARY"

